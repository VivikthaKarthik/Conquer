    <script type="text/javascript">
        $(document).ready(function () {
            get(
                "Explorer",
                "GetAllCategories",
                function (response) {
                    const data = response;

                    if (data != null && data.isSuccess) {
                        var categories = data.result;

                        if (categories != null && categories.length > 0) {
                            const container = document.getElementById("CategoriesRow");
                            container.innerHTML = ""; // Clear any existing content

                            categories.forEach((category) => {
                                const div = document.createElement("div");
                                div.className = "col-lg-3 col-md-5";
                                div.style.marginTop = "20px";

                                div.addEventListener("click", () => {
                                    NavigateTo("category.html?categoryId=" + category.id);
                                });

                                div.innerHTML = `<div class="team-member-card">
                                                    <div class="content-wrapper">
                                                        <div class="content">
                                                            <h2 class="title">${category.name}</h2>
                                                        </div>
                                                    </div>
                                                    <div class="image">
                                                        <img src="${category.thumbNail}" />
                                                    </div>
                                                </div>`;
                                container.appendChild(div);
                            });
                        }
                    }
                },
                HandleError
            );

            LoadMainMenu('Projects');
        });


        function HandleError(response) {
            alert("There is an issue in calling WebAPi. Please try again");
            console.error("Error:", response);
        }

        function showModal() {
            window.location.href = 'addcategories.html'
        }
    </script>
