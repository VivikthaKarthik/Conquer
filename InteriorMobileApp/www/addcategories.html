  <script type="text/javascript">

    function HandleError(response) {
      alert("There is an issue in calling WebAPi. Please try again");
      cosole.error("Error:", response);
    }

    document.getElementById('imageInput').addEventListener('change', function (event) {

      const file = event.target.files[0];

      if (file) {
        const reader = new FileReader();

        reader.onload = function (e) {
          const preview = document.getElementById('preview');
          preview.src = e.target.result;
          preview.style.display = 'block';
        }

        reader.readAsDataURL(file);
      }
    });

    document.getElementById('uploadForm').addEventListener('submit', function (event) {
      event.preventDefault(); // Prevent the default form submission

      const name = document.getElementById('name').value;
      const description = document.getElementById('description').value;
      const imageInput = document.getElementById('imageInput');

      const file = imageInput.files[0];

      if (name && description && file) {
        const formData = new FormData();
        formData.append('name', name);
        formData.append('description', description);
        formData.append('thumbnail', 'Test.jpg');
        formData.append('image', file);

        fetch('https://localhost:7092/api/Explorer/SaveImage', {
          method: 'POST',
          body: formData
        })
          .then(response => response.json())
          .then(data => {
            console.log('Success:', data);
            alert('Image and details saved successfully!');
          })
          .catch((error) => {
            console.error('Error:', error);
            alert('An error occurred while saving the image and details.');
          });
        // post(
        //   "api/Explorer/SaveImage",
        //   formData,
        //   function (response) {
        //     const data = response;
        //     console.log('Success:', data);
        //     alert('Image and details saved successfully!');
        //   },
        //   HandleError
        // );
      } else {
        alert('Please fill in all fields and select an image.');
      }
    });

    function post(url, data, onSuccess, onError) {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          onSuccess(JSON.parse(xhr.responseText));
        } else {
          onError(xhr.statusText);
        }
      };
      xhr.onerror = function () {
        onError(xhr.statusText);
      };
      xhr.send(data);
    }

    function HandleError(error) {
      console.error('An error occurred:', error);
      alert('An error occurred while saving the image and details.');
    }


    function closeModal() {
      window.location.href = "Explore.html";
    }

  </script>
